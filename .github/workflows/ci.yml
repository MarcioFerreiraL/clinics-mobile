name: CI do app

on:
  push:
    branches: [develop, main]
    paths: ['clinics/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [develop, main]
    paths: ['clinics/**', '.github/workflows/ci.yml']

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Gerar APK de debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://clinics.marciodev.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: clinics-apk-debug
          path: clinics/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
