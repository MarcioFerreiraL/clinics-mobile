name: CI do app

on:
  push:
    branches: [develop, main]
    paths: ['clinics/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [develop, main]
    paths: ['clinics/**', '.github/workflows/ci.yml']

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Gerar APK de debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://clinics.marciodev.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: clinics-apk-debug
          path: clinics/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release:
    name: Publicar APK assinado
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Os secrets não podem ser usados direto em `if`; este atalho diz se a chave foi configurada.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: clinics
    steps:
      - name: Aviso quando a chave de assinatura não está configurada
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Configure os secrets ANDROID_KEYSTORE_* para publicar o APK assinado."
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: env.HAS_KEYSTORE == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Preparar a chave de assinatura
        if: env.HAS_KEYSTORE == 'true'
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/clinics-release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/clinics-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - name: Gerar o APK de release
        if: env.HAS_KEYSTORE == 'true'
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://clinics.marciodev.com' }}
          cp build/app/outputs/flutter-apk/app-release.apk clinics.apk
      - name: Mover a tag app-latest para este commit
        if: env.HAS_KEYSTORE == 'true'
        working-directory: .
        run: |
          git tag -f app-latest
          git push -f origin app-latest
      - name: Publicar na release fixa app-latest
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Clinics (versão mais recente)
          body: |
            APK assinado do Clinics para Android. Baixe `clinics.apk` e instale.
            Gerado automaticamente a cada push na branch develop (build ${{ github.run_number }}).
          files: clinics/clinics.apk
          make_latest: true
